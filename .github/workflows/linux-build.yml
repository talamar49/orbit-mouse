name: Linux build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Bump patch version
        id: version
        shell: bash
        run: |
          npm version patch --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libusb-1.0-0-dev libudev-dev

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run build:linux

      - name: Prepare release assets and checksums
        run: |
          install -m 0755 resources/install-linux-permissions.sh release/install-linux-permissions.sh
          sha256sum release/*.AppImage release/*.deb release/*.rpm release/install-linux-permissions.sh > release/SHA256SUMS.txt

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: orbit-mouse-linux-${{ steps.version.outputs.version }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/install-linux-permissions.sh
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit version bump
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            release/*.AppImage release/*.deb release/*.rpm \
            release/install-linux-permissions.sh release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Orbit Mouse Studio v${VERSION}" \
            --generate-notes
